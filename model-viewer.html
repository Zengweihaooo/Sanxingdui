<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>模型预览 · 三星堆</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #07090d;
      color: #fff;
      font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    /* 嵌入 index 的 iframe 内：页面与 WebGL 清屏透明，透出下层脉络页 */
    html.model-viewer-embed,
    html.model-viewer-embed body {
      background: transparent !important;
    }
    html.model-viewer-embed #loading {
      background: rgba(7, 9, 13, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #viewport {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
      cursor: grab;
      transition: opacity 0.22s ease;
    }
    #viewport:active { cursor: grabbing; }
    #viewport.is-switching { opacity: 0.62; }
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(7, 9, 13, 0.92), transparent);
      pointer-events: none;
    }
    #ui a, #ui button { pointer-events: auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(94, 162, 217, 0.45);
      background: rgba(28, 34, 41, 0.88);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover {
      border-color: #5ea2d9;
      background: rgba(40, 50, 62, 0.95);
    }
    button.btn {
      font: inherit;
      cursor: pointer;
    }
    #hint {
      display: none;
    }
    .kbd-hint {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 1px;
      border-radius: 4px;
      font-size: 10px;
      font-family: ui-monospace, monospace;
      border: 1px solid rgba(94, 162, 217, 0.45);
      background: rgba(0, 0, 0, 0.25);
      color: #5ea2d9;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090d;
      font-size: 14px;
      color: #8b9bb4;
    }
    #loading.hidden { display: none; }
    #error {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      max-width: 90vw;
      padding: 10px 16px;
      background: rgba(140, 50, 50, 0.92);
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    #error.show { display: block; }

    .side-model-chip {
      position: fixed;
      top: 50%;
      z-index: 14;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(94, 162, 217, 0.38);
      background: rgba(18, 22, 28, 0.68);
      color: #9db2cb;
      font-size: 11px;
      letter-spacing: 0.06em;
      transform: translateY(-50%);
      opacity: 0.9;
      pointer-events: none;
      user-select: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.25s ease;
    }
    #side-model-left { left: 16px; }
    #side-model-right { right: 16px; text-align: right; }
    .side-model-chip.hidden { opacity: 0; }
    #thirds-grid {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    #thirds-grid .thirds-col {
      position: relative;
    }
    #thirds-grid .thirds-col:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 8%;
      right: 0;
      width: 1px;
      height: 84%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(94, 162, 217, 0.18),
        transparent
      );
    }

    /* 悬浮文物说明：跟随光标（位置由 JS 写入 left/top），整体显隐 */
    #mask-info {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 25;
      width: min(400px, calc(100vw - 24px));
      pointer-events: none;
      opacity: 0;
      transform: scale(0.94);
      transform-origin: 0 0;
      filter: blur(5px);
      transition:
        opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.38s ease;
      will-change: left, top, transform, opacity;
    }
    #mask-info.is-visible {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
    .mask-info-content {
      transition:
        opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mask-info-content.mask-info-content--exit {
      opacity: 0;
      transform: translate3d(0, 10px, 0);
    }
    @keyframes mask-info-content-enter {
      from {
        opacity: 0;
        transform: translate3d(0, -8px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    .mask-info-content.mask-info-content--enter {
      animation: mask-info-content-enter 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    #mask-info .mask-info__frame {
      position: relative;
      border-radius: 14px;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(94, 162, 217, 0.55),
        rgba(74, 107, 140, 0.25) 40%,
        rgba(94, 162, 217, 0.15) 100%
      );
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06) inset,
        0 24px 48px rgba(0, 0, 0, 0.45),
        0 0 80px rgba(94, 162, 217, 0.12);
    }
    #mask-info .mask-info__inner {
      border-radius: 13px;
      padding: 18px 20px 20px;
      background: rgba(18, 22, 28, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    #mask-info .mask-info__eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #5ea2d9;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    #mask-info .mask-info__title {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      line-height: 1.35;
      color: #fff;
    }
    #mask-info .mask-info__body {
      font-size: 13px;
      line-height: 1.75;
      color: #b4c0d4;
    }
    #mask-info .mask-info__body p + p {
      margin-top: 10px;
    }
    #mask-info .mask-info__accent {
      display: block;
      width: 36px;
      height: 2px;
      margin-top: 16px;
      border-radius: 1px;
      background: linear-gradient(90deg, #5ea2d9, transparent);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.08s;
    }
    #mask-info.is-visible .mask-info__accent {
      transform: scaleX(1);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
    }
  }
  </script>
</head>
<body>
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('model-viewer-embed');
    }
  </script>
  <div id="loading" aria-live="polite">正在加载 FBX 模型…</div>
  <div id="error" role="alert"></div>
  <div id="ui">
    <button type="button" class="btn" id="model-viewer-back">← 返回脉络图</button>
    <p id="hint">
      左键拖拽：旋转视角 · 右键拖拽：平移 · 滚轮：缩放<br/>
      <span style="opacity:0.85">光标移到模型上：总述 · 按 <kbd class="kbd-hint">1</kbd> 耳部 · 按 <kbd class="kbd-hint">2</kbd> 眼部</span><br/>
      <span style="opacity:0.75;font-size:11px">模型默认绕竖轴缓转，拖拽时暂停</span>
    </p>
  </div>
  <canvas id="viewport"></canvas>
  <div id="thirds-grid" aria-hidden="true">
    <div class="thirds-col"></div>
    <div class="thirds-col"></div>
    <div class="thirds-col"></div>
  </div>
  <div id="side-model-left" class="side-model-chip hidden" aria-hidden="true"></div>
  <div id="side-model-right" class="side-model-chip hidden" aria-hidden="true"></div>
  <aside id="mask-info" aria-hidden="true">
    <div class="mask-info__frame">
      <div class="mask-info__inner">
        <div id="mask-info-content" class="mask-info-content">
          <p class="mask-info__eyebrow" id="mask-info-eyebrow">文物档案</p>
          <h2 class="mask-info__title" id="mask-info-title">三星堆 · 青铜面具</h2>
          <div class="mask-info__body" id="mask-info-body"></div>
          <span class="mask-info__accent" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </aside>
  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /** 模型序列：4,5,6,1,2,3（左右键切换中间主模型） */
    const MODEL_DEFS = [
      {
        id: 'm04',
        label: '模型 4',
        fbx: new URL('./模型/04-梵犀设计/01.fbx', import.meta.url).href,
        textureDir: new URL('./模型/04-梵犀设计/texture/', import.meta.url).href
      },
      {
        id: 'm05',
        label: '模型 5',
        fbx: new URL('./模型/05-梵犀设计/05.fbx', import.meta.url).href,
        textureDir: new URL('./模型/05-梵犀设计/texture/', import.meta.url).href
      },
      {
        id: 'm06',
        label: '模型 6',
        fbx: new URL('./模型/06-梵犀设计/done.fbx', import.meta.url).href,
        textureDir: new URL('./模型/06-梵犀设计/texture/', import.meta.url).href
      },
      {
        id: 'm01',
        label: '模型 1',
        fbx: new URL('./模型/01-梵犀设计/01.fbx', import.meta.url).href,
        textureDir: new URL('./模型/01-梵犀设计/texture/', import.meta.url).href
      },
      {
        id: 'm02',
        label: '模型 2',
        fbx: new URL('./模型/02-梵犀设计/02.FBX', import.meta.url).href,
        textureDir: new URL('./模型/02-梵犀设计/texture/', import.meta.url).href
      },
      {
        id: 'm03',
        label: '模型 3',
        fbx: new URL('./模型/03-梵犀设计/01.fbx', import.meta.url).href,
        textureDir: new URL('./模型/03-梵犀设计/texture/', import.meta.url).href
      }
    ];

    function remapTextureUrl(url, textureDir) {
      var u = String(url).replace(/\\/g, '/');
      if (/^(blob:|data:)/i.test(u)) return u;
      var lower = u.toLowerCase();
      var idx = lower.indexOf('.jpg');
      var extLen = 4;
      if (idx === -1) {
        idx = lower.indexOf('.jpeg');
        extLen = 5;
      }
      if (idx === -1) {
        idx = lower.indexOf('.png');
        extLen = 4;
      }
      if (idx === -1) return u;
      var slash = u.lastIndexOf('/', idx);
      var raw = u.substring(slash + 1, idx + extLen);
      if (!/^[\w.-]+\.(jpe?g|png)$/i.test(raw)) return u;
      var file = raw.replace(/\.jpeg$/i, '.jpg');
      return textureDir + file;
    }

    const canvas = document.getElementById('viewport');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const sideLeftEl = document.getElementById('side-model-left');
    const sideRightEl = document.getElementById('side-model-right');
    const embedded = window.self !== window.top;

    var backBtn = document.getElementById('model-viewer-back');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        if (embedded) {
          try {
            window.parent.postMessage({ type: 'sanxingdui-close-model-viewer' }, '*');
          } catch (e) {}
        } else {
          window.location.href = 'index.html';
        }
      });
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
      loadingEl.classList.add('hidden');
    }

    const scene = new THREE.Scene();
    if (embedded) {
      scene.background = null;
    } else {
      scene.background = new THREE.Color(0x07090d);
    }

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.001, 50000);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: embedded
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (embedded) {
      renderer.setClearColor(0x000000, 0);
    }
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new OrbitControls(camera, canvas);
    controls.enabled = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.52));
    const key = new THREE.DirectionalLight(0xffffff, 1.05);
    key.position.set(200, 400, 250);
    key.castShadow = true;
    key.shadow.mapSize.setScalar(2048);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x8eb8d8, 0.42);
    rim.position.set(-300, 120, -200);
    scene.add(rim);

    var modelItems = [];
    var selectedModelIdx = 1;
    var activeModelRoot = null;
    var activeSpinY = 0;
    var maskInfoEl = document.getElementById('mask-info');
    var maskEyebrowEl = document.getElementById('mask-info-eyebrow');
    var maskTitleEl = document.getElementById('mask-info-title');
    var maskBodyEl = document.getElementById('mask-info-body');
    var raycaster = new THREE.Raycaster();
    var mouseNdc = new THREE.Vector2(-99, -99);
    var pointerDown = false;
    var wasOverModel = false;
    var overModel = false;
    var infoMode = 'full';
    var clock = new THREE.Clock();
    var modelSpinRadPerSec = 0.35;
    var draggingModel = false;
    var dragStartX = 0;
    var dragStartY = 0;
    var dragStartRotX = 0;
    var dragStartRotY = 0;
    var lastClientX = 0;
    var lastClientY = 0;
    var panelPosX = 0;
    var panelPosY = 0;
    var panelFollowLerp = 0.24;
    var cursorPanelOffsetX = 20;
    var cursorPanelOffsetY = 18;
    var layoutSideOffset = 180;
    var maskContentWrap = document.getElementById('mask-info-content');
    var lastAppliedMode = null;
    var contentSwitchTimer = null;
    var contentEnterTimer = null;
    var modelSwitchAnimTimer = null;

    function clampPanelToViewport(x, y, el) {
      var w = el.offsetWidth || 360;
      var h = el.offsetHeight || 220;
      var pad = 10;
      x = Math.max(pad, Math.min(x, window.innerWidth - w - pad));
      y = Math.max(pad, Math.min(y, window.innerHeight - h - pad));
      return { x: x, y: y };
    }

    function getActiveItem() {
      return modelItems[selectedModelIdx] || null;
    }

    var INFO_COPY = {
      full: {
        eyebrow: '文物档案',
        title: '三星堆 · 青铜面具',
        html:
          '<p>此类面具出土于四川广汉三星堆遗址祭祀坑，属商代晚期青铜重器，面部夸张、双目纵突，兼具人形与神性，一般被认为是古蜀祭祀中与神灵沟通的法器或崇拜偶像。</p>' +
          '<p>合金铸造与套铸工艺精湛，表面可见绿锈与局部贴金痕迹；与中原同期青铜器在造型系统上差异显著，是研究古蜀文明宗教与权力表达的重要实物。</p>'
      },
      ear: {
        eyebrow: '局部细读 · 耳部',
        title: '夸张耳形与冠饰衔接',
        html:
          '<p>耳部体量硕大、外展明显，与面部形成强烈轮廓对比，既强化「非人」视觉张力，也承担与额际、冠饰构件衔接的结构作用，常见于祭祀语境中对听觉与通神能力的象征化表达。</p>' +
          '<p>铸造上多为分铸或套铸后再与面部结合，转折处可见打磨与补铸痕迹；锈蚀与贴金残存往往沿耳廓走向分布，可作观察浇铸顺序与后期修饰的线索。</p>'
      },
      eye: {
        eyebrow: '局部细读 · 眼部',
        title: '纵目与眼眶的仪式语言',
        html:
          '<p>眼部是最具辨识度的特征之一：柱状前伸的「纵目」与宽深的眼眶共同构成强烈的凝视感，在宗教图像逻辑中多被解读为超越常人的视域与神性注视。</p>' +
          '<p>眼周与眉弓过渡处常形成锐利棱线，配合镶嵌或彩绘残迹（若存），可还原当年礼仪展示中的光影效果；数字化模型便于从多角度观察凸起尺度与对称关系。</p>'
      }
    };

    function applyInfoMode(mode, animated) {
      var data = INFO_COPY[mode] || INFO_COPY.full;
      function writeDom() {
        if (maskEyebrowEl) maskEyebrowEl.textContent = data.eyebrow;
        if (maskTitleEl) maskTitleEl.textContent = data.title;
        if (maskBodyEl) maskBodyEl.innerHTML = data.html;
        lastAppliedMode = mode;
      }

      if (!maskContentWrap) {
        writeDom();
        return;
      }

      if (!animated || lastAppliedMode === null || mode === lastAppliedMode) {
        if (contentSwitchTimer) {
          clearTimeout(contentSwitchTimer);
          contentSwitchTimer = null;
        }
        if (contentEnterTimer) {
          clearTimeout(contentEnterTimer);
          contentEnterTimer = null;
        }
        maskContentWrap.classList.remove('mask-info-content--exit', 'mask-info-content--enter');
        writeDom();
        return;
      }

      if (contentSwitchTimer) clearTimeout(contentSwitchTimer);
      if (contentEnterTimer) clearTimeout(contentEnterTimer);

      maskContentWrap.classList.remove('mask-info-content--enter');
      maskContentWrap.classList.add('mask-info-content--exit');

      contentSwitchTimer = setTimeout(function () {
        contentSwitchTimer = null;
        writeDom();
        maskContentWrap.classList.remove('mask-info-content--exit');
        void maskContentWrap.offsetWidth;
        maskContentWrap.classList.add('mask-info-content--enter');
        contentEnterTimer = setTimeout(function () {
          contentEnterTimer = null;
          maskContentWrap.classList.remove('mask-info-content--enter');
        }, 500);
      }, 200);
    }

    applyInfoMode('full', false);

    window.addEventListener('keydown', function (e) {
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.repeat) return;
      var k = e.code;
      if (k === 'ArrowLeft') {
        e.preventDefault();
        switchModelByDelta(-1);
      } else if (k === 'ArrowRight') {
        e.preventDefault();
        switchModelByDelta(1);
      } else if (k === 'Digit1' || k === 'Numpad1') {
        e.preventDefault();
        infoMode = 'ear';
        if (overModel) applyInfoMode('ear', true);
      } else if (k === 'Digit2' || k === 'Numpad2') {
        e.preventDefault();
        infoMode = 'eye';
        if (overModel) applyInfoMode('eye', true);
      }
    });

    canvas.addEventListener('pointerdown', function (e) {
      pointerDown = true;
      if (!activeModelRoot) return;
      var rect = canvas.getBoundingClientRect();
      mouseNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNdc, camera);
      var hits = raycaster.intersectObject(activeModelRoot, true);
      draggingModel = hits.length > 0;
      if (!draggingModel) return;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      var activeItem = getActiveItem();
      if (!activeItem) return;
      dragStartRotX = activeItem.userRotX || 0;
      dragStartRotY = activeItem.userRotY || 0;
    });
    canvas.addEventListener('pointerup', function () {
      pointerDown = false;
      draggingModel = false;
    });
    canvas.addEventListener('pointerleave', function () {
      pointerDown = false;
      draggingModel = false;
      mouseNdc.set(-99, -99);
    });
    canvas.addEventListener('pointermove', function (e) {
      lastClientX = e.clientX;
      lastClientY = e.clientY;
      var rect = canvas.getBoundingClientRect();
      mouseNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      if (!draggingModel) return;
      var activeItem = getActiveItem();
      if (!activeItem) return;
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      activeItem.userRotY = dragStartRotY + dx * 0.008;
      activeItem.userRotX = Math.max(-1.0, Math.min(1.0, dragStartRotX + dy * 0.005));
    });

    function applyMaterialColorSpaces(object) {
      object.traverse(function (child) {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        if (!child.material) return;
        var mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(function (m) {
          function lin(t) {
            if (t) {
              t.colorSpace = THREE.NoColorSpace;
              t.needsUpdate = true;
            }
          }
          function srgb(t) {
            if (t) {
              t.colorSpace = THREE.SRGBColorSpace;
              t.needsUpdate = true;
            }
          }
          srgb(m.map);
          srgb(m.emissiveMap);
          lin(m.normalMap);
          lin(m.bumpMap);
          lin(m.roughnessMap);
          lin(m.metalnessMap);
          lin(m.aoMap);
          lin(m.alphaMap);
          lin(m.specularMap);
          lin(m.displacementMap);
          if (m.clearcoatNormalMap) lin(m.clearcoatNormalMap);
          m.needsUpdate = true;
        });
      });
    }

    function loadModelDef(def) {
      return new Promise(function (resolve, reject) {
        var manager = new THREE.LoadingManager();
        manager.setURLModifier(function (url) {
          var next = remapTextureUrl(url, def.textureDir);
          return next !== url ? next : url;
        });
        var loader = new FBXLoader(manager);
        loader.load(
          def.fbx,
          function (object) {
            applyMaterialColorSpaces(object);
            object.updateMatrixWorld(true);
            var box = new THREE.Box3().setFromObject(object);
            var center = box.getCenter(new THREE.Vector3());
            /* 统一把每个模型几何中心移到本地原点，避免左右栏位“看起来没居中” */
            object.position.sub(center);
            object.updateMatrixWorld(true);
            box.setFromObject(object);
            var size = box.getSize(new THREE.Vector3());
            var maxDim = Math.max(size.x, size.y, size.z, 1e-6);
            var normalizeScale = 220 / maxDim;
            var holder = new THREE.Group();
            holder.add(object);
            holder.userData.baseScale = normalizeScale;
            holder.userData.def = def;
            scene.add(holder);
            resolve({
              id: def.id,
              label: def.label,
              holder: holder,
              root: object,
              userRotX: 0,
              userRotY: 0
            });
          },
          undefined,
          reject
        );
      });
    }

    function updateSideChips() {
      if (!sideLeftEl || !sideRightEl) return;
      if (!modelItems.length) return;
      var leftItem = modelItems[selectedModelIdx - 1] || null;
      var rightItem = modelItems[selectedModelIdx + 1] || null;
      if (leftItem) {
        sideLeftEl.textContent = leftItem.label;
        sideLeftEl.classList.remove('hidden');
      } else {
        sideLeftEl.classList.add('hidden');
      }
      if (rightItem) {
        sideRightEl.textContent = rightItem.label;
        sideRightEl.classList.remove('hidden');
      } else {
        sideRightEl.classList.add('hidden');
      }
    }

    function frameSelectedModel() {
      var selected = modelItems[selectedModelIdx];
      if (!selected) return;
      selected.holder.updateMatrixWorld(true);
      var box = new THREE.Box3().setFromObject(selected.holder);
      var size = box.getSize(new THREE.Vector3());
      var center = box.getCenter(new THREE.Vector3());
      var maxDim = Math.max(size.x, size.y, size.z, 1e-6);
      var radius = maxDim * 0.5;
      var aspect = Math.max(window.innerWidth / window.innerHeight, 1e-6);
      var orthoPadding = 1.45;
      var halfH = radius * orthoPadding;
      var halfW = halfH * aspect;
      camera.left = -halfW;
      camera.right = halfW;
      camera.top = halfH;
      camera.bottom = -halfH;
      /* 正交三分栏：左右中心点为视锥宽度的 1/3 */
      layoutSideOffset = (halfW * 2) / 3;

      var dist = Math.max(radius * 4.5, 1);
      var viewDir = new THREE.Vector3(0.55, 0.35, 1).normalize();
      camera.position.copy(center).add(viewDir.multiplyScalar(dist));
      camera.lookAt(center);
      camera.updateMatrixWorld();
      camera.near = Math.max(0.001, dist / 50000);
      camera.far = Math.max(5000, dist * 50 + radius * 10);
      camera.updateProjectionMatrix();
    }

    function updateModelLayout(doFrame) {
      if (!modelItems.length) return;
      var centerX = 0;
      var sideOffset = layoutSideOffset;
      var sideScaleFactor = 0.36;
      modelItems.forEach(function (item, i) {
        var delta = i - selectedModelIdx;
        if (delta === 0) {
          item.holder.visible = true;
          item.holder.position.set(centerX, 0, 0);
          item.holder.scale.setScalar(item.holder.userData.baseScale);
        } else if (delta === 1) {
          item.holder.visible = true;
          item.holder.position.set(sideOffset, 0, 0);
          item.holder.scale.setScalar(item.holder.userData.baseScale * sideScaleFactor);
        } else if (delta === -1) {
          item.holder.visible = true;
          item.holder.position.set(-sideOffset, 0, 0);
          item.holder.scale.setScalar(item.holder.userData.baseScale * sideScaleFactor);
        } else {
          item.holder.visible = false;
        }
      });
      activeModelRoot = modelItems[selectedModelIdx].root;
      modelItems.forEach(function (item, i) {
        if (i !== selectedModelIdx) {
          item.root.rotation.x = 0;
          item.root.rotation.y = 0;
          item.root.rotation.z = 0;
        }
      });
      updateSideChips();
      if (doFrame) frameSelectedModel();
    }

    function switchModelByDelta(delta) {
      if (!modelItems.length) return;
      var next = selectedModelIdx + delta;
      if (next < 0 || next >= modelItems.length) return;
      selectedModelIdx = next;
      activeSpinY = 0;
      infoMode = 'full';
      applyInfoMode('full', true);
      updateModelLayout(true);
      playModelSwitchAnimation();
    }

    function playModelSwitchAnimation() {
      if (!canvas) return;
      if (modelSwitchAnimTimer) {
        clearTimeout(modelSwitchAnimTimer);
        modelSwitchAnimTimer = null;
      }
      canvas.classList.remove('is-switching');
      void canvas.offsetWidth;
      canvas.classList.add('is-switching');
      modelSwitchAnimTimer = setTimeout(function () {
        modelSwitchAnimTimer = null;
        canvas.classList.remove('is-switching');
      }, 220);
    }

    Promise.all(MODEL_DEFS.map(loadModelDef))
      .then(function (loaded) {
        modelItems = loaded;
        selectedModelIdx = 1; // 默认模型5在中间
        updateModelLayout(true);
        loadingEl.classList.add('hidden');
      })
      .catch(function (err) {
        console.error(err);
        showError(
          '模型加载失败。请用本地 HTTP 服务打开站点（勿直接用 file://），并确认 04/05/06 模型与对应 texture 目录存在。'
        );
      });

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      frameSelectedModel();
      updateModelLayout(false);
    }
    window.addEventListener('resize', onResize);

    function tick() {
      requestAnimationFrame(tick);
      var dt = clock.getDelta();

      if (activeModelRoot) {
        if (!pointerDown) activeSpinY += modelSpinRadPerSec * dt;
        modelItems.forEach(function (item, i) {
          if (i === selectedModelIdx) {
            item.root.rotation.x = item.userRotX || 0;
            item.root.rotation.y = activeSpinY + (item.userRotY || 0);
            item.root.rotation.z = 0;
          } else {
            item.root.rotation.x = 0;
            item.root.rotation.y = 0;
            item.root.rotation.z = 0;
          }
        });
      }

      if (activeModelRoot && maskInfoEl) {
        raycaster.setFromCamera(mouseNdc, camera);
        var hits = raycaster.intersectObject(activeModelRoot, true);
        var over = hits.length > 0 && !pointerDown;

        if (over) {
          maskInfoEl.classList.add('is-visible');
        } else {
          maskInfoEl.classList.remove('is-visible');
          if (wasOverModel && maskContentWrap) {
            if (contentSwitchTimer) {
              clearTimeout(contentSwitchTimer);
              contentSwitchTimer = null;
            }
            if (contentEnterTimer) {
              clearTimeout(contentEnterTimer);
              contentEnterTimer = null;
            }
            maskContentWrap.classList.remove('mask-info-content--exit', 'mask-info-content--enter');
            lastAppliedMode = null;
          }
        }

        if (over && !wasOverModel) {
          infoMode = 'full';
          applyInfoMode('full', false);
          var snap = clampPanelToViewport(
            lastClientX + cursorPanelOffsetX,
            lastClientY + cursorPanelOffsetY,
            maskInfoEl
          );
          panelPosX = snap.x;
          panelPosY = snap.y;
          maskInfoEl.style.left = Math.round(panelPosX) + 'px';
          maskInfoEl.style.top = Math.round(panelPosY) + 'px';
        } else if (over) {
          var target = clampPanelToViewport(
            lastClientX + cursorPanelOffsetX,
            lastClientY + cursorPanelOffsetY,
            maskInfoEl
          );
          panelPosX += (target.x - panelPosX) * panelFollowLerp;
          panelPosY += (target.y - panelPosY) * panelFollowLerp;
          maskInfoEl.style.left = Math.round(panelPosX) + 'px';
          maskInfoEl.style.top = Math.round(panelPosY) + 'px';
        }

        wasOverModel = over;
        overModel = over;

        maskInfoEl.setAttribute('aria-hidden', over ? 'false' : 'true');
        canvas.style.cursor = pointerDown ? 'grabbing' : over ? 'pointer' : 'grab';
      }

      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
