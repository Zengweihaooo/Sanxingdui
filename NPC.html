<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPC 对话台 · 三星堆</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(18, 22, 28, 0.82);
      --panel-strong: rgba(24, 31, 40, 0.92);
      --line: rgba(94, 162, 217, 0.28);
      --line-strong: rgba(94, 162, 217, 0.6);
      --text: #e7edf7;
      --muted: #8b9bb4;
      --accent: #5ea2d9;
      --user-bubble: rgba(47, 76, 110, 0.55);
      --npc-bubble: rgba(25, 33, 43, 0.9);
    }

    * { box-sizing: border-box; margin: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 42% 32% at 20% 12%, rgba(94, 162, 217, 0.12), transparent 70%),
        radial-gradient(ellipse 45% 38% at 90% 90%, rgba(94, 162, 217, 0.08), transparent 72%),
        var(--bg);
      transform: translateX(0);
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 沉浸（简约）模式：整块界面相对桌面模式向右平移 10%，与对话条切换同一套缓动 */
    .app.app-shift-cinematic {
      transform: translateX(10%);
    }

    .chat-pane {
      position: absolute;
      left: 18px;
      top: 18px;
      bottom: 18px;
      width: min(560px, calc(100vw - 36px));
      z-index: 5;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(to bottom, rgba(7, 9, 13, 0.92), rgba(7, 9, 13, 0.72));
      display: grid;
      grid-template-rows: 1fr auto;
      min-width: 0;
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.46);
      overflow: hidden;
      transform: translateX(0);
      transition:
        left 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        bottom 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        right 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 0.4s ease,
        box-shadow 0.45s ease,
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        grid-template-rows 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 沉浸模式：隐藏整块对话台主体，仅底部居中悬浮输入条 */
    .chat-pane.layout-cinematic {
      left: 50%;
      right: auto;
      top: auto;
      bottom: max(20px, env(safe-area-inset-bottom, 0px) + 12px);
      width: min(560px, calc(100vw - 32px));
      transform: translateX(-50%);
      border-radius: 18px;
      grid-template-rows: 0fr auto;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(94, 162, 217, 0.12) inset,
        0 0 60px rgba(94, 162, 217, 0.08);
    }

    .chat-desk-top {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      opacity: 1;
      transition:
        opacity 0.38s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chat-pane.layout-cinematic .chat-desk-top {
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .chat-pane,
      .chat-desk-top,
      .viewer-reply-bubble,
      .api-key-panel,
      .app {
        transition-duration: 0.01ms !important;
      }
    }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(10, 14, 20, 0.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .title-wrap h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #eaf3ff;
    }
    .title-wrap p {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .ghost-btn {
      border: 1px solid var(--line);
      background: rgba(16, 22, 30, 0.85);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .ghost-btn:hover { border-color: var(--line-strong); color: #d7e9ff; }

    .messages {
      overflow: auto;
      padding: 14px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .chat-desk-top .messages {
      flex: 1;
      min-height: 0;
    }

    .msg {
      max-width: 88%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 11px;
      line-height: 1.6;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      white-space: pre-wrap;
    }
    .msg.npc { align-self: flex-start; background: var(--npc-bubble); }
    .msg.user { align-self: flex-end; background: var(--user-bubble); border-color: rgba(128, 188, 240, 0.4); }
    .msg.meta {
      align-self: center;
      max-width: 100%;
      border-style: dashed;
      font-size: 12px;
      color: var(--muted);
      background: rgba(20, 26, 34, 0.5);
    }

    /* 简略/沉浸模式：以预览框右上为锚再向左移 15vw；小三角在左下指向模型 */
    .viewer-reply-bubble {
      position: absolute;
      left: auto;
      right: calc(14px + 15vw);
      top: 48px;
      z-index: 4;
      max-width: min(360px, calc(100% - 28px - 15vw));
      padding: 12px 14px 16px;
      font-size: 13px;
      line-height: 1.65;
      border-radius: 14px 14px 6px 14px;
      background: linear-gradient(155deg, rgba(34, 44, 58, 0.94), rgba(22, 28, 38, 0.92));
      border: 1px solid rgba(94, 162, 217, 0.38);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 14px 36px rgba(0, 0, 0, 0.42),
        0 0 40px rgba(94, 162, 217, 0.1);
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform-origin: bottom left;
      transform: translate(10px, -8px) scale(0.98);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.4s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0.45s;
    }

    .viewer-reply-bubble.is-visible {
      transform: translate(0, 0) scale(1);
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.4s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }
    .viewer-reply-bubble[hidden] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .viewer-reply-bubble .latest-label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      opacity: 0.92;
    }
    .viewer-reply-bubble .viewer-reply-body {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
    .viewer-reply-bubble::after {
      content: '';
      position: absolute;
      left: 14px;
      right: auto;
      bottom: -7px;
      width: 12px;
      height: 12px;
      background: linear-gradient(155deg, rgba(26, 34, 46, 0.96), rgba(18, 24, 32, 0.94));
      border-right: 1px solid rgba(94, 162, 217, 0.25);
      border-bottom: 1px solid rgba(94, 162, 217, 0.25);
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .viewer-reply-bubble.is-placeholder {
      border-style: dashed;
      opacity: 0.85;
    }
    .viewer-reply-bubble.is-placeholder .viewer-reply-body {
      color: var(--muted);
      font-size: 12px;
    }

    .input-pane {
      border-top: 1px solid var(--line);
      padding: 12px;
      background: rgba(10, 14, 20, 0.82);
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .chat-pane.layout-cinematic .input-pane {
      border-top: none;
      padding: 14px 14px 12px;
      background: linear-gradient(to bottom, rgba(12, 16, 22, 0.94), rgba(8, 11, 16, 0.92));
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: end;
    }

    textarea {
      resize: none;
      min-height: 44px;
      max-height: 132px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 10px 11px;
      line-height: 1.5;
      outline: none;
      font-size: 13px;
    }
    textarea:focus { border-color: var(--line-strong); box-shadow: 0 0 0 2px rgba(94, 162, 217, 0.18); }

    .icon-btn, .send-btn {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: #d9ebff;
      cursor: pointer;
      height: 44px;
      min-width: 44px;
      padding: 0 12px;
      font-size: 13px;
    }
    .icon-btn:hover, .send-btn:hover { border-color: var(--line-strong); }
    .icon-btn.recording {
      border-color: rgba(236, 91, 91, 0.8);
      box-shadow: 0 0 0 2px rgba(236, 91, 91, 0.2);
      color: #ffdcdc;
    }

    .helper {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .helper select {
      font: inherit;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      max-width: min(220px, 42vw);
    }

    /* 右下角可折叠：手动填写 / 保存方舟密钥（与 apikey.txt 自动填充并存） */
    .api-key-dock {
      position: fixed;
      right: max(12px, env(safe-area-inset-right, 0px));
      bottom: max(12px, env(safe-area-inset-bottom, 0px));
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    .api-key-dock > * {
      pointer-events: auto;
    }
    .api-key-dock-toggle {
      border: 1px solid var(--line);
      background: rgba(16, 22, 30, 0.92);
      color: #cfe3f8;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .api-key-dock-toggle:hover {
      border-color: var(--line-strong);
      color: #fff;
    }
    .api-key-dock.is-open .api-key-dock-toggle {
      border-color: rgba(94, 162, 217, 0.55);
    }
    .api-key-panel {
      width: min(380px, calc(100vw - 24px));
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(6px);
      transition:
        max-height 0.38s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease,
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .api-key-dock.is-open .api-key-panel {
      max-height: 600px;
      opacity: 1;
      transform: translateY(0);
    }
    .api-key-panel-inner {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px 10px;
      background: linear-gradient(160deg, rgba(14, 18, 26, 0.96), rgba(8, 11, 16, 0.94));
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .api-key-save-row {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }
    .api-key-save-hint {
      font-size: 10px;
      color: var(--muted);
      flex: 1;
      min-width: 0;
    }
    .api-key-save-btn {
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: rgba(36, 52, 72, 0.9);
      color: #e8f4ff;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    .api-key-save-btn:hover {
      border-color: var(--accent);
    }

    .api-config {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .api-config label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .api-config input {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
    }
    .api-config input:focus {
      border-color: var(--line-strong);
    }
    .api-config select {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
    }
    .api-config select:focus {
      border-color: var(--line-strong);
    }
    .api-config label.api-config-full-row {
      grid-column: 1 / -1;
    }
    @media (max-width: 520px) {
      .api-config {
        grid-template-columns: 1fr;
      }
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .viewer-pane {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 58% 52% at 58% 45%, rgba(94, 162, 217, 0.12), transparent 68%),
        #07090d;
    }
    #npc-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #npc-canvas:active { cursor: grabbing; }

    .viewer-tag {
      position: absolute;
      right: 14px;
      top: 12px;
      z-index: 3;
      border: 1px solid var(--line);
      background: rgba(12, 17, 24, 0.8);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      color: #cfe3f8;
      letter-spacing: 0.05em;
    }

    /* index.html 内 iframe 嵌入（?embedded=1）：页面与 3D 区域背景透明，透出下层脉络页 */
    html.npc-embedded,
    html.npc-embedded body {
      background: transparent;
    }
    html.npc-embedded .app {
      background: transparent;
    }
    html.npc-embedded .viewer-pane {
      background: transparent;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="app">
    <section class="chat-pane" aria-label="三星堆 NPC 对话">
      <div class="chat-desk-top">
        <header class="chat-header">
          <div class="title-wrap">
            <h1>三星堆 NPC 对话台</h1>
            <p id="chat-subtitle">完整对话台 · 按 <kbd style="font-size:10px;padding:1px 5px;border:1px solid rgba(94,162,217,0.4);border-radius:4px;">/</kbd> 切换沉浸对话（仅底部输入 + 全屏模型）</p>
          </div>
          <button id="clear-history" class="ghost-btn" type="button">清空记录</button>
        </header>

        <div id="messages" class="messages"></div>
      </div>

      <div class="input-pane">
        <div class="input-row">
          <textarea id="text-input" placeholder="输入你的问题（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="voice-btn" class="icon-btn" type="button" title="语音输入">🎙️</button>
          <button id="send-btn" class="send-btn" type="button">发送</button>
        </div>
        <div class="helper">
          <span id="voice-status">语音状态：待机</span>
          <span style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:flex-end;">
            <span>对话：方舟流式 · 朗读：</span>
            <select id="tts-backend" title="选择回复朗读方式" aria-label="朗读引擎">
              <option value="webspeech">本机 Web Speech</option>
              <option value="qwen">千问 TTS（HTTP 同步）</option>
              <option value="qwen-realtime">千问 TTS 实时（WebSocket + 本地代理）</option>
            </select>
            <button id="tts-toggle" type="button" class="ghost-btn" style="padding:2px 8px;font-size:11px;">语音回复：开</button>
          </span>
        </div>
      </div>
    </section>

    <div class="api-key-dock" id="api-key-dock">
      <div class="api-key-panel" id="api-key-panel" role="region" aria-label="API 与语音密钥">
        <div class="api-key-panel-inner">
          <div class="api-config">
            <label>方舟 API Key（Bearer）
              <input type="password" id="apiToken" name="apiToken" autocomplete="off" placeholder="粘贴控制台 API Key" />
            </label>
            <label>模型 ID（勿填 ep-）
              <input type="text" id="apiModelId" name="apiModelId" spellcheck="false" placeholder="doubao-seed-2-0-lite-260215" />
            </label>
            <label class="api-config-full-row">百炼语音地域（须与控制台创建 API Key 的地域一致，见<a href="https://help.aliyun.com/zh/model-studio/get-api-key" target="_blank" rel="noopener noreferrer" style="color:#5ea2d9;">获取 API Key</a>）
              <select id="dashscope-region" name="dashscopeRegion" title="华北2 用北京端点；新加坡等用国际端点">
                <option value="cn">华北2（北京）· dashscope.aliyuncs.com</option>
                <option value="intl">新加坡等 · dashscope-intl.aliyuncs.com</option>
              </select>
            </label>
            <label class="api-config-full-row">百炼 API Key（语音合成，选填；通用格式 sk-…，非 Coding Plan 的 sk-sp-…）
              <input type="password" id="dashscopeToken" name="dashscopeToken" autocomplete="off" placeholder="控制台复制的百炼 API Key；勿提交仓库" />
            </label>
            <label class="api-config-full-row">百炼 TTS 代理 URL（HTTP 同步；强烈建议填写；留空时若直连失败会自动试 127.0.0.1:8788）
              <input type="text" id="dashscopeProxyUrl" name="dashscopeProxyUrl" spellcheck="false" placeholder="http://127.0.0.1:8788/tts（需先 node scripts/dashscope-tts-proxy.mjs）" />
            </label>
            <label class="api-config-full-row">百炼 TTS 实时 WS 代理（选「千问 TTS 实时」时必填；浏览器无法直连 dashscope WebSocket）
              <input type="text" id="dashscopeRealtimeWsUrl" name="dashscopeRealtimeWsUrl" spellcheck="false" placeholder="ws://127.0.0.1:8789/realtime（需先 npm install && node scripts/dashscope-tts-realtime-proxy.mjs）" />
            </label>
          </div>
          <div class="api-key-save-row">
            <span class="api-key-save-hint" id="api-key-save-hint">apikey.txt：第 1 行方舟 Key、第 2 行百炼 Key、第 3 行可选 cn 或 intl（与控制台地域一致）、第 4 行可选 HTTP 代理 URL、第 5 行可选实时 WS 代理；以 # 开头的行为注释</span>
            <button type="button" class="api-key-save-btn" id="api-key-save-btn">保存</button>
          </div>
        </div>
      </div>
      <button type="button" class="api-key-dock-toggle" id="api-key-dock-toggle" aria-expanded="false" aria-controls="api-key-panel">密钥</button>
    </div>

    <section class="viewer-pane">
      <canvas id="npc-canvas"></canvas>
      <div id="viewer-reply-bubble" class="viewer-reply-bubble" hidden aria-live="polite">
        <span class="latest-label">最新回复</span>
        <div class="viewer-reply-body"></div>
      </div>
      <div class="viewer-tag">模型 2（FBX + 纹理）</div>
    </section>
  </main>
  <!-- 千问 TTS 返回 URL 时用 DOM 音频播放；playsinline 利于 iOS；嵌入 iframe 时需配合父页 allow=autoplay -->
  <audio id="npc-tts-audio" preload="auto" playsinline hidden></audio>

  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const STORAGE_KEY = 'sanxingdui_npc_chat_history_v1';
    const STORAGE_ARK_TOKEN = 'sanxingdui_ark_api_token_v1';

    function primeMediaPlaybackFromUserGesture() {
      try {

          gain.gain.value = 1e-5;
          osc.connect(gain);
          gain.connect(ctx.destination);

        /* ignore */

        a.removeAttribute('src');
        a.src = silent;

        if (pl && pl.catch) pl.catch(function () {});
        a.pause();
        a.removeAttribute('src');
        a.volume = 1;
        a.load();
      } catch (e2) {
        /* ignore */
      }

    function qwenRtPlayPcm16LeChunk(ctx, u8) {
      if (!u8 || !u8.byteLength || !ctx) return;
      var len = u8.byteLength;
      if (len % 2 !== 0) len -= 1;
      if (len < 2) return;
      var n = len / 2;
      var buffer = ctx.createBuffer(1, n, 24000);
      var ch = buffer.getChannelData(0);
      var dv = new DataView(u8.buffer, u8.byteOffset, len);
      for (var i = 0; i < n; i++) {
        ch[i] = dv.getInt16(i * 2, true) / 32768;
      }
      var src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(ctx.destination);
      var t = Math.max(qwenRtNextPlayTime, ctx.currentTime);
      src.start(t);
      qwenRtNextPlayTime = t + buffer.duration;
      qwenRtSources.push(src);
    }

    /** 百炼返回的 wav 链接常为 http://OSS；在 https 页面会被混合内容拦截，改为 https 通常可播。 */

      var u = String(url || '').trim();
      if (!u) return u;

    function isLocalInsecureUrlBlockedBySecurePage(urlStr) {
      if (typeof window === 'undefined' || !window.isSecureContext) return false;
      if (!urlStr || typeof urlStr !== 'string') return false;
      try {
        var u = new URL(urlStr, window.location.href);

        var h = (u.hostname || '').replace(/^\[|\]$/g, '').toLowerCase();
        return h === 'localhost' || h === '127.0.0.1' || h === '::1';

    /**

     */
    function pickTtsVoice() {
      if (!('speechSynthesis' in window)) return null;
      var zhVoices = getZhSpeechVoices();
      if (zhVoices.length) {
        var male = zhVoices.find(isLikelyMaleSpeechVoice);
        if (male) return male;
        var neutral = zhVoices.find(function (v) {
          return !isLikelyFemaleSpeechVoice(v);
        });
        if (neutral) return neutral;
        return zhVoices[0];
      }
      var voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      var male = voices.find(isLikelyMaleSpeechVoice);
      if (male) return male;
      var neutral = voices.find(function (v) {
        return !isLikelyFemaleSpeechVoice(v);
      });
      if (neutral) return neutral;
      return voices[0];

    /**
     * synthesis-failed 常见于：强行绑定了与引擎不兼容的 voice、或 cancel 后立即 speak。
     * 策略：先不指定 voice（仅 zh-CN），再依次尝试系统中文 voice，最后兜底默认；每次 cancel 后延迟再 speak。
     */
    function speakTextWebSpeech(text) {
      if (!('speechSynthesis' in window)) {
        pushTtsMeta('当前浏览器不支持 Web Speech 朗读。');
        return;
      }
      if (!text) return;
      var synth = window.speechSynthesis;
      try {
        if (synth.paused) synth.resume();
      } catch (e) {
        /* ignore */
      }

      var plain = String(text)
        .replace(/\r\n/g, '\n')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 8000);
      if (!plain) return;

      function buildUtteranceStrategies() {
        var list = [];
        list.push(function () {
          var u = new SpeechSynthesisUtterance(plain);
          u.lang = 'zh-CN';
          u.rate = 1;
          u.pitch = 1;
          u.volume = 1;
          return u;
        });
        var zh = getZhSpeechVoices();
        var maxZh = Math.min(zh.length, 4);
        for (var zi = 0; zi < maxZh; zi++) {
          (function (voice) {
            list.push(function () {
              var u = new SpeechSynthesisUtterance(plain);
              u.voice = voice;
              u.lang = (voice.lang || 'zh-CN').slice(0, 32);
              u.rate = 1;
              u.pitch = 1;
              u.volume = 1;
              return u;
            });
          })(zh[zi]);
        }
        var picked = ttsVoice || pickTtsVoice();
        if (picked) {
          var uri = picked.voiceURI || '';
          var dup = zh.some(function (v) {
            return (v.voiceURI || '') === uri;
          });
          if (!dup) {
            list.push(function () {
              var u = new SpeechSynthesisUtterance(plain);
              u.voice = picked;
              u.lang = (picked.lang || 'zh-CN').slice(0, 32);
              u.rate = 1;
              u.pitch = 1;
              u.volume = 1;
              return u;
            });
          }
        }
        list.push(function () {
          var u = new SpeechSynthesisUtterance(plain);
          u.volume = 1;
          return u;
        });
        return list;
      }

      function finalizeFail(msg) {
        pushTtsMeta(
          msg ||
            (IS_EMBEDDED
              ? '嵌入页内本机朗读常被浏览器限制。请在「朗读」中选「千问 TTS」，或新标签单独打开 NPC.html。'
              : '本机语音多次重试仍失败。可试：换 Safari/Chrome、系统设置 → 辅助功能 → 「朗读内容」、或改用「千问 TTS」。')
        );
      }

      var factories = buildUtteranceStrategies();

      function speakAfterCancel(utter, i) {
        try {
          synth.cancel();
        } catch (e) {
          /* ignore */
        }
        setTimeout(function () {
          try {
            synth.speak(utter);
          } catch (e) {
            runAttempt(i + 1);
          }
        }, 52);
      }

      function runAttempt(i) {
        if (i >= factories.length) {
          finalizeFail(null);
          return;
        }
        var utter;
        try {
          utter = factories[i]();
        } catch (e) {
          runAttempt(i + 1);
          return;
        }
        utter.onerror = function (ev) {
          var code = ev && ev.error ? String(ev.error) : '';
          if (code === 'canceled' || code === 'interrupted') return;
          if (code === 'not-allowed') {
            finalizeFail(
              '朗读被浏览器拦截（not-allowed）。请先在本页内点击输入区或「发送」再试，或改用「千问 TTS」。'
            );
            return;
          }
          if (
            code === 'synthesis-failed' ||
            code === 'synthesis-unavailable' ||
            code === 'network' ||
            code === 'audio-busy'
          ) {
            runAttempt(i + 1);
            return;
          }
          finalizeFail('本机语音朗读失败（' + (code || 'unknown') + '）。');
        };
        speakAfterCancel(utter, i);
      }

      function startSpeaking() {
        factories = buildUtteranceStrategies();
        runAttempt(0);
      }

      if (!(synth.getVoices() || []).length) {
        var fired = false;
        var onVoices = function () {
          if (fired) return;
          fired = true;
          synth.removeEventListener('voiceschanged', onVoices);
          startSpeaking();
        };
        synth.addEventListener('voiceschanged', onVoices);
        setTimeout(onVoices, 500);
        return;
      }

      startSpeaking();
    }

    /**
     * 百炼 Qwen-TTS-Realtime：WebSocket 文本帧协议与官方 SDK 一致（server_commit：append → session.finish）。
     * 浏览器无法设置握手 Authorization，须通过 scripts/dashscope-tts-realtime-proxy.mjs 转发。
     */
    function speakTextQwenRealtimeAsync(text) {
      var plain = ttsPlainTextForQwen(text);
      if (!plain) return;
      var wsUrl =
        (dashscopeRealtimeWsUrlEl && dashscopeRealtimeWsUrlEl.value.trim()) ||
        DASHSCOPE_LOCAL_REALTIME_WS_DEFAULT;
      if (isLocalInsecureUrlBlockedBySecurePage(wsUrl)) {
        pushTtsMeta(
          '当前页面为 https，浏览器会拦截本机 ws:// 实时 TTS 代理（混合内容）。请用 http:// 打开本地站点后再试，或为代理配置 wss://。'
        );
        speakTextWebSpeech(text);
        return;
      }
      if (!/^wss?:\/\//i.test(wsUrl)) {
        pushTtsMeta(
          '「千问 TTS 实时」需要可访问的 ws:// 或 wss:// 代理地址（默认 ' +
            DASHSCOPE_LOCAL_REALTIME_WS_DEFAULT +
            '）。请先 cd scripts && npm install && node dashscope-tts-realtime-proxy.mjs 并 export DASHSCOPE_API_KEY。'
        );
        speakTextWebSpeech(text);
        return;
      }

      var ctxAudio = qwenRtEnsureAudioContext();
      if (!ctxAudio) {
        pushTtsMeta('当前环境无法创建 Web Audio（AudioContext），已改本机朗读。');
        speakTextWebSpeech(text);
        return;
      }
      try {
        var r = ctxAudio.resume();
        if (r && typeof r.then === 'function') r.catch(function () {});
      } catch (e) {
        /* ignore */
      }
      qwenRtNextPlayTime = Math.max(qwenRtNextPlayTime, ctxAudio.currentTime);

      var ws;
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        pushTtsMeta(
          '实时 TTS：无法创建 WebSocket（' + (e && e.message ? e.message : String(e)) + '）。'
        );
        speakTextWebSpeech(text);
        return;
      }
      qwenRealtimeWs = ws;

      var doneFallback = false;
      function fallbackOnce(msg) {
        if (doneFallback) return;
        doneFallback = true;
        try {
          ws.close();
        } catch (e) {
          /* ignore */
        }
        if (qwenRealtimeWs === ws) qwenRealtimeWs = null;
        pushTtsMeta(msg);
        speakTextWebSpeech(text);
      }

      var safetyTimer = window.setTimeout(function () {
        if (qwenRealtimeWs === ws) {
          try {
            ws.close();
          } catch (e) {
            /* ignore */
          }
          qwenRealtimeWs = null;
        }
      }, 180000);

      var appendSent = false;
      var appendKickTimer = null;
      function sendAppendAndFinish() {
        if (appendSent || qwenRealtimeWs !== ws) return;
        appendSent = true;
        if (appendKickTimer != null) {
          window.clearTimeout(appendKickTimer);
          appendKickTimer = null;
        }
        try {
          var maxChunk = 1200;
          for (var o = 0; o < plain.length; o += maxChunk) {
            ws.send(
              JSON.stringify({
                event_id: genDashRtEventId(),
                type: 'input_text_buffer.append',
                text: plain.slice(o, o + maxChunk),
              })
            );
          }
          ws.send(
            JSON.stringify({
              event_id: genDashRtEventId(),
              type: 'session.finish',
            })
          );
        } catch (sendErr) {
          window.clearTimeout(safetyTimer);
          fallbackOnce(
            '实时 TTS 发送失败：' + (sendErr && sendErr.message ? sendErr.message : String(sendErr))
          );
        }
      }

      ws.onopen = function () {
        if (qwenRealtimeWs !== ws) return;
        try {
          ws.send(
            JSON.stringify({
              event_id: genDashRtEventId(),
              type: 'session.update',
              session: {
                voice: QWEN_TTS_VOICE,
                mode: 'server_commit',
                response_format: 'pcm',
                sample_rate: 24000,
                language_type: 'Chinese',
              },
            })
          );
          appendKickTimer = window.setTimeout(function () {
            if (qwenRealtimeWs === ws) sendAppendAndFinish();
          }, 480);
        } catch (sendErr) {
          window.clearTimeout(safetyTimer);
          fallbackOnce(
            '实时 TTS 发送失败：' + (sendErr && sendErr.message ? sendErr.message : String(sendErr))
          );
        }
      };

      ws.onmessage = function (ev) {
        if (qwenRealtimeWs !== ws) return;
        var raw = ev.data;
        if (typeof raw !== 'string') return;
        var evo;
        try {
          evo = JSON.parse(raw);
        } catch (parseErr) {
          return;
        }
        var typ = evo.type || '';
        if (typ === 'session.updated') {
          sendAppendAndFinish();
          return;
        }
        if (typ === 'response.audio.delta') {
          var b64 = evo.delta;
          if (typeof b64 !== 'string' || !b64) {
            var aud = evo.audio;
            if (aud && typeof aud.delta === 'string') b64 = aud.delta;
          }
          if (typeof b64 !== 'string' || !b64) return;
          try {
            var binStr = atob(b64);
            var u8 = new Uint8Array(binStr.length);
            for (var i = 0; i < binStr.length; i++) {
              u8[i] = binStr.charCodeAt(i) & 0xff;
            }
            qwenRtPlayPcm16LeChunk(ctxAudio, u8);
          } catch (decErr) {
            /* ignore bad chunk */
          }
          return;
        }
        if (typ === 'session.finished') {
          window.clearTimeout(safetyTimer);
          if (qwenRealtimeWs === ws) {
            try {
              ws.close();
            } catch (e) {
              /* ignore */
            }
            qwenRealtimeWs = null;
          }
          return;
        }
        if (
          typ === 'error' ||
          typ === 'response.error' ||
          (evo.error && (evo.error.message || typeof evo.error === 'string'))
        ) {
          window.clearTimeout(safetyTimer);
          var em =
            (evo.error && evo.error.message) ||
            (typeof evo.error === 'string' ? evo.error : '') ||
            evo.message ||
            '服务端 error 事件';
          fallbackOnce('实时 TTS：' + em);
        }
      };

      ws.onerror = function () {
        window.clearTimeout(safetyTimer);
        if (doneFallback) return;
        fallbackOnce(
          '实时 TTS：WebSocket 异常。北京地域 Key：代理勿设 DASHSCOPE_REGION=intl；确认已 cd scripts && npm install && node dashscope-tts-realtime-proxy.mjs 且已 export DASHSCOPE_API_KEY。若页面是 https，本机 ws:// 会被拦截，请改用 http:// 打开本站。'
        );
      };

      ws.onclose = function () {
        window.clearTimeout(safetyTimer);
        if (qwenRealtimeWs === ws) qwenRealtimeWs = null;
      };
    }

    async function speakTextQwenAsync(text) {
      var plain = ttsPlainTextForQwen(text);
      if (!plain) return;
      var proxy = dashscopeProxyUrlEl && dashscopeProxyUrlEl.value.trim();
      var key = dashscopeTokenEl && dashscopeTokenEl.value.trim();
      if (!proxy && !key) {
        pushTtsMeta(
          '已选「千问 TTS」但未填写百炼 API Key，也未填代理 URL。说明：本页用的是「语音合成 Qwen-TTS」HTTP 同步接口（返回 wav URL），不是文档里「实时语音合成 Qwen-TTS-Realtime」的 WebSocket。浏览器几乎无法直连 dashscope（CORS），请运行 node scripts/dashscope-tts-proxy.mjs 并 export DASHSCOPE_API_KEY，代理填 http://127.0.0.1:8788/tts；或用 node scripts/dashscope-tts-test.mjs 自测 Key。'
        );
        speakTextWebSpeech(text);
        return;
      }

      if (proxy && isLocalInsecureUrlBlockedBySecurePage(proxy)) {
        pushTtsMeta(
          '当前页面为 https，浏览器会拦截对本机 http:// 百炼代理的请求（混合内容）。北京地域 Key 无误时也仍会失败。请用 http://127.0.0.1:端口 打开本站（勿用 https），或将页面与代理部署为同源可访问的地址。'
        );
        speakTextWebSpeech(text);
        return;
      }

      qwenTtsAbort = new AbortController();
      var ac = qwenTtsAbort;

      async function requestQwenTtsAudioUrl(endpoint, headers, bodyObj) {
        var res = await fetch(endpoint, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(bodyObj),
          signal: ac.signal,
        });
        var rawText = await res.text();
        var data = null;
        try {
          data = rawText ? JSON.parse(rawText) : null;
        } catch (parseErr) {
          throw new Error('百炼返回非 JSON（HTTP ' + res.status + '）：' + rawText.slice(0, 240));
        }
        if (ac !== qwenTtsAbort) return '';
        if (!res.ok || !data) {
          throw new Error((data && (data.message || data.code)) || 'HTTP ' + res.status);
        }
        if (data.code != null && String(data.code).trim() !== '') {
          throw new Error(data.message || String(data.code));
        }
        var sc = data.status_code;
        if (sc != null && Number(sc) !== 200) {
          throw new Error(data.message || '百炼返回 status_code=' + sc);
        }
        var out = data.output || {};
        var aud = out.audio || {};
        var url = normalizeDashScopeAudioUrl(aud.url || aud.audio_url);
        if (!url) {
          var dbg = '';
          try {
            dbg = JSON.stringify(data).slice(0, 320);
          } catch (e) {
            dbg = String(data);
          }
          throw new Error('响应中无音频 URL：' + dbg);
        }
        return url;
      }

      function isLikelyBrowserCorsOrNetwork(err) {
        var nm = err && err.message ? err.message : String(err);
        return /Failed to fetch|NetworkError|Load failed|networkerror|ECONNREFUSED|fetch.*failed|blocked by CORS/i.test(nm);
      }

      try {
        var audioUrl = '';

        if (proxy) {
          audioUrl = await requestQwenTtsAudioUrl(
            proxy,
            { 'Content-Type': 'application/json' },
            {
              text: plain,
              model: QWEN_TTS_MODEL,
              voice: QWEN_TTS_VOICE,
              language_type: 'Chinese',
            }
          );
        } else {
          try {
            audioUrl = await requestQwenTtsAudioUrl(
              getDashScopeDirectTtsUrl(),
              {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + key,
              },
              {
                model: QWEN_TTS_MODEL,
                input: {
                  text: plain,
                  voice: QWEN_TTS_VOICE,
                  language_type: 'Chinese',
                },
              }
            );
          } catch (directErr) {
            if (!isLikelyBrowserCorsOrNetwork(directErr)) {
              throw directErr;
            }
            if (isLocalInsecureUrlBlockedBySecurePage(DASHSCOPE_LOCAL_PROXY_DEFAULT)) {
              throw new Error(
                'https 页面无法访问本机 ' +
                  DASHSCOPE_LOCAL_PROXY_DEFAULT +
                  '。请用 http:// 打开本地页面并启动 dashscope-tts-proxy.mjs。'
              );
            }
            try {
              audioUrl = await requestQwenTtsAudioUrl(
                DASHSCOPE_LOCAL_PROXY_DEFAULT,
                { 'Content-Type': 'application/json' },
                {
                  text: plain,
                  model: QWEN_TTS_MODEL,
                  voice: QWEN_TTS_VOICE,
                  language_type: 'Chinese',
                }
              );
              if (!qwenLocalProxyHintShown) {
                qwenLocalProxyHintShown = true;
                pushTtsMeta(
                  '浏览器无法直连百炼（CORS），已自动走本机 ' +
                    DASHSCOPE_LOCAL_PROXY_DEFAULT +
                    '。请保持终端运行：export DASHSCOPE_API_KEY=你的Key && node scripts/dashscope-tts-proxy.mjs；并把该 URL 填进「百炼 TTS 代理」可省去一次失败重试。'
                );
              }
            } catch (proxyErr) {
              throw new Error(
                '直连失败：' +
                  (directErr && directErr.message ? directErr.message : String(directErr)) +
                  ' | 本机代理也失败（是否已启动代理且已 export DASHSCOPE_API_KEY？）：' +
                  (proxyErr && proxyErr.message ? proxyErr.message : String(proxyErr))
              );
            }
          }
        }

        if (ac !== qwenTtsAbort || !audioUrl) return;

        var el = document.getElementById('npc-tts-audio');
        if (!el) {
          throw new Error('页面缺少音频元素 #npc-tts-audio');
        }
        qwenTtsAudio = el;
        if (el.__npcBlobUrl) {
          try {
            URL.revokeObjectURL(el.__npcBlobUrl);
          } catch (e) {
            /* ignore */
          }
          el.__npcBlobUrl = null;
        }
        el.pause();
        el.removeAttribute('src');
        el.load();

        var playFromSrc = function (src, blobUrlFlag) {
          try {
            el.removeAttribute('crossOrigin');
          } catch (e) {
            /* ignore */
          }
          el.src = src;
          if (blobUrlFlag) el.__npcBlobUrl = src;
          var p = el.play();
          if (p && p.catch) {
            p.catch(function (playErr) {
              pushTtsMeta(
                '千问音频无法播放：' +
                  (playErr && playErr.message ? playErr.message : String(playErr)) +
                  '。可先点击页面内「发送」再试，或单独打开 NPC.html。'
              );
              speakTextWebSpeech(text);
            });
          }
        };

        try {
          var ar = await fetch(audioUrl, { mode: 'cors', credentials: 'omit', signal: ac.signal });
          if (!ar.ok) throw new Error('拉取音频 HTTP ' + ar.status);
          var blob = await ar.blob();
          playFromSrc(URL.createObjectURL(blob), true);
        } catch (fetchErr) {
          if (fetchErr && fetchErr.name === 'AbortError') return;
          try {
            playFromSrc(audioUrl, false);
          } catch (e2) {
            throw fetchErr || e2;
          }
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        pushTtsMeta(
          '千问 TTS 失败，已改用本机朗读。提示：本页为 HTTP 同步合成（qwen3-tts-flash），与「实时语音合成 Qwen-TTS-Realtime」WebSocket 文档不是同一路径。排查：node scripts/dashscope-tts-test.mjs。详情：' +
            (err && err.message ? err.message : String(err))
        );
        speakTextWebSpeech(text);
      }
    }

    /** 从同目录 apikey.txt 读取首行填入 Key（成功则覆盖输入框并写入 localStorage） */
    async function loadApiKeyFromTxtFile() {
      if (!apiTokenEl) return;

        const res = await fetch(APIKEY_TXT_URL.href, { cache: 'no-store' });
        if (!res.ok) return;
        const raw = (await res.text()).trim();
        if (!raw) return;
        const lines = raw
          .split(/\r?\n/)
          .map(function (l) {
            return l.trim();
          })
          .filter(function (l) {
            return l && l.charAt(0) !== '#';
          });
        if (!lines.length) return;
        apiTokenEl.value = lines[0];
        if (lines[1] && dashscopeTokenEl) {
          dashscopeTokenEl.value = lines[1];
        }
        if (lines[2] && dashscopeRegionEl) {
          var reg = lines[2].toLowerCase();
          if (reg === 'intl' || reg === 'sg' || reg === 'singapore') {
            dashscopeRegionEl.value = 'intl';
          } else {
            dashscopeRegionEl.value = 'cn';
          }
        }
        if (lines[3] && dashscopeProxyUrlEl && /^https?:\/\//i.test(lines[3])) {
          dashscopeProxyUrlEl.value = lines[3];
        }
        if (lines[4] && dashscopeRealtimeWsUrlEl && /^wss?:\/\//i.test(lines[4])) {
          dashscopeRealtimeWsUrlEl.value = lines[4];

    /**
     * OpenAI 兼容 SSE 流式对话（方舟 ark.cn-beijing…/chat/completions 支持 stream: true）
     * onDelta(chunk, accumulated) 可选，用于逐段更新 UI
     */
    async function streamArkChat(userText, onDelta) {
      const token = (apiTokenEl && apiTokenEl.value.trim()) || '';
      const model = (apiModelIdEl && apiModelIdEl.value.trim()) || ARK_DEFAULT_MODEL;
      if (!token) throw new Error('未填写 API Key');

      const res = await fetch(ARK_API_URL, {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: NPC_SYSTEM_PROMPT },
            { role: 'user', content: userText },
          ],
          max_tokens: 512,
          temperature: 0.85,
          stream: true,
        }),
      });

      if (!res.ok) {
        var errText = await res.text();
        var errJson = {};
        try {
          errJson = JSON.parse(errText);
        } catch (e) {
          /* ignore */
        }
        var errMsg =
          (errJson.error && errJson.error.message) || errJson.message || errText || 'HTTP ' + res.status;
        throw new Error(errMsg);
      }

      if (!res.body || typeof res.body.getReader !== 'function') {
        throw new Error('当前环境不支持流式响应读取');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      var carry = '';
      var full = '';

      while (true) {
        var step = await reader.read();
        if (step.done) break;
        carry += decoder.decode(step.value, { stream: true });
        var lines = carry.split(/\r?\n/);
        carry = lines.pop() || '';

        for (var li = 0; li < lines.length; li++) {
          var line = lines[li].trim();
          if (!line || line.charAt(0) === ':') continue;
          if (line === 'data: [DONE]') continue;
          if (line.indexOf('data: ') !== 0) continue;
          var payload = line.slice(6).trim();
          if (!payload || payload === '[DONE]') continue;
          try {
            var json = JSON.parse(payload);
            var choice = json.choices && json.choices[0];
            if (!choice) continue;
            var delta = choice.delta;
            if (delta && delta.content) {
              full += delta.content;
              if (typeof onDelta === 'function') onDelta(delta.content, full);
            }
          } catch (parseErr) {
            /* 半包或扩展字段，忽略 */
          }
        }
      }

      return full;
    }

      startStreamEllipsisTicker();
      history.push({ role: 'npc', text: '' });
      saveHistory();
      renderHistory();

      try {
        var reply = await streamArkChat(text, function (_chunk, acc) {
          if (history.length && history[history.length - 1].role === 'npc') {
            history[history.length - 1].text = acc;
            scheduleStreamHistoryRedraw();
          }
        });
        streamRenderPending = false;
        reply = String(reply || '').trim();
        if (history.length && history[history.length - 1].role === 'npc') {
          history[history.length - 1].text = reply || '（未返回有效正文）';
        }
        saveHistory();
        renderHistory();
        if (reply) {
          speakText(reply);
          triggerNpcGestureForReply(reply);
        }
      } catch (err) {
        streamRenderPending = false;
        stopAllTts();
        resetStreamSideEffects();
        var msg = err && err.message ? err.message : String(err);
        if (history.length && history[history.length - 1].role === 'npc') {
          history.pop();
        }
        saveHistory();
        history.push({ role: 'meta', text: '方舟 API：' + msg });
        history.push({ role: 'npc', text: getFallbackReply(text) });
        saveHistory();
        renderHistory();
        speakText(history[history.length - 1].text);
        triggerNpcGestureForReply(history[history.length - 1].text);
      } finally {
        arkStreamActive = false;
        stopStreamEllipsisTicker();
        arkRequestPending = false;
        sendBtnEl.disabled = false;
        saveHistory();
        renderHistory();
      }
    }

    sendBtnEl.addEventListener('click', function () {
      sendCurrentText();
    });
    textInputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCurrentText();
      }
    });
    if (apiTokenEl) {
      apiTokenEl.addEventListener('change', persistArkConfig);
      apiTokenEl.addEventListener('blur', persistArkConfig);
    }
    if (apiModelIdEl) {
      apiModelIdEl.addEventListener('change', persistArkConfig);
      apiModelIdEl.addEventListener('blur', persistArkConfig);
    }
    if (dashscopeTokenEl) {
      dashscopeTokenEl.addEventListener('change', persistArkConfig);
      dashscopeTokenEl.addEventListener('blur', persistArkConfig);
    }
    if (dashscopeProxyUrlEl) {
      dashscopeProxyUrlEl.addEventListener('change', persistArkConfig);
      dashscopeProxyUrlEl.addEventListener('blur', persistArkConfig);
    }
    if (dashscopeRealtimeWsUrlEl) {
      dashscopeRealtimeWsUrlEl.addEventListener('change', persistArkConfig);
      dashscopeRealtimeWsUrlEl.addEventListener('blur', persistArkConfig);
    }
    if (dashscopeRegionEl) {
      dashscopeRegionEl.addEventListener('change', persistArkConfig);
    }
    if (ttsBackendEl) {
      ttsBackendEl.addEventListener('change', persistArkConfig);
    }

    if (apiKeyDockToggleEl && apiKeyDockEl) {
      apiKeyDockToggleEl.addEventListener('click', function () {
        var open = !apiKeyDockEl.classList.contains('is-open');
        apiKeyDockEl.classList.toggle('is-open', open);
        apiKeyDockToggleEl.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open && apiTokenEl) {
          setTimeout(function () {
            apiTokenEl.focus();
          }, 0);
        }
      });
    }
    if (apiKeySaveBtnEl) {
      apiKeySaveBtnEl.addEventListener('click', function () {
        persistArkConfig();
        if (apiKeySaveHintEl) {
          var prev = apiKeySaveHintEl.textContent;
          apiKeySaveHintEl.textContent = '已保存到本机浏览器';
          setTimeout(function () {
            apiKeySaveHintEl.textContent = prev;
          }, 2000);
        }
      });
    }

    clearHistoryEl.addEventListener('click', function () {
      history = [];
      localStorage.removeItem(STORAGE_KEY);
      loadHistory();
      renderHistory();
    });
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function () {
        ttsVoice = pickTtsVoice();
      };
      ttsVoice = pickTtsVoice();
    }
    if (ttsToggleEl) {
      ttsToggleEl.addEventListener('click', function () {
        ttsEnabled = !ttsEnabled;
        ttsToggleEl.textContent = '语音回复：' + (ttsEnabled ? '开' : '关');
        if (!ttsEnabled) {
          stopAllTts();
        }
      });
    }

    window.addEventListener('keydown', function (e) {
      if (IS_EMBEDDED && e.key === 'Escape') {
        e.preventDefault();
        try {
          window.parent.postMessage({ type: 'sanxingdui-close-npc-overlay' }, '*');
        } catch (err) {
          /* ignore */
        }
        return;
      }
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.code === 'Slash' || e.key === '/') {
        e.preventDefault();
        setLayoutMode(layoutMode === 'desk' ? 'cinematic' : 'desk');
      }
    });

    // ===== Voice Input (Web Speech API) =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.lang = 'zh-CN';
      recognizer.continuous = false;
      recognizer.interimResults = true;

      recognizer.onstart = function () {
        isRecording = true;
        voiceBtnEl.classList.add('recording');
        voiceStatusEl.textContent = '语音状态：录音中...';
      };

      recognizer.onresult = function (event) {
        let finalText = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          finalText += event.results[i][0].transcript || '';
        }
        textInputEl.value = finalText.trim();
      };

      recognizer.onend = function () {
        isRecording = false;
        voiceBtnEl.classList.remove('recording');
        voiceStatusEl.textContent = '语音状态：待机';
      };

      recognizer.onerror = function () {
        isRecording = false;
        voiceBtnEl.classList.remove('recording');
        voiceStatusEl.textContent = '语音状态：异常，请重试';
      };
    } else {
      voiceStatusEl.textContent = '语音状态：当前浏览器不支持';
      appendMessage('meta', '当前浏览器不支持 Web Speech API，语音输入不可用。');
    }

    voiceBtnEl.addEventListener('click', function () {
      if (!recognizer) return;
      if (isRecording) {
        recognizer.stop();
      } else {
        recognizer.start();
      }
    });

    loadArkConfig();
    void loadApiKeyFromTxtFile();
    loadHistory();
    setLayoutMode('desk');

    // ===== 3D Viewer (Model 2 + textures) =====
    const canvas = document.getElementById('npc-canvas');
    const scene = new THREE.Scene();
    if (IS_EMBEDDED) {
      scene.background = null;
    } else {
      scene.background = new THREE.Color(0x07090d);
    }

    const camera = new THREE.PerspectiveCamera(
      44,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      50000
    );

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: IS_EMBEDDED });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(220, 320, 260);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x8eb8d8, 0.38);
    rim.position.set(-280, 120, -180);
    scene.add(rim);

    function remapTextureUrl(url) {
      const u = String(url).replace(/\\/g, '/');
      if (/^(blob:|data:)/i.test(u)) return u;
      const m = u.match(/([\w.-]+\.(?:jpg|jpeg|png))/i);
      if (!m) return u;
      return TEXTURE_DIR + m[1].replace(/\.jpeg$/i, '.jpg');
    }

    const manager = new THREE.LoadingManager();
    manager.setURLModifier(function (url) {
      const next = remapTextureUrl(url);
      return next !== url ? next : url;
    });

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    controls.minDistance = 30;
    controls.maxDistance = 5000;

    let modelRoot = null;
    let modelBaseScale = 1;
    let idleTime = 0;
    let gestureActive = false;
    let gestureDuration = 0.78;
    let gestureElapsed = 0;
    let gestureAmplitude = 0.16;
    let gestureCycles = 1.25;

    /** 仅点头（rotation.x）；时长 = 字数×0.3s；幅度约为再上一版基线的 1/3 */
    function triggerNpcGestureForReply(text) {
      if (!modelRoot) return;
      var len = text ? String(text).length : 0;
      gestureDuration = Math.max(0.3, len * 0.3);
      gestureCycles = Math.min(16, Math.max(2.2, gestureDuration * 0.52));
      var lenBoost = Math.min(0.11, len * 0.00225);
      gestureAmplitude =
        Math.min(0.29, 0.17 + Math.random() * 0.07 + lenBoost) / 3;
      gestureActive = true;
      gestureElapsed = 0;
      modelRoot.rotation.x = 0;
      modelRoot.rotation.y = 0;
      modelRoot.rotation.z = 0;
      modelRoot.scale.setScalar(modelBaseScale);
    }

    function applyMaterialColorSpaces(object) {
      object.traverse(function (child) {
        if (!child.isMesh || !child.material) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(function (m) {
          function srgb(t) { if (t) { t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; } }
          function lin(t) { if (t) { t.colorSpace = THREE.NoColorSpace; t.needsUpdate = true; } }
          srgb(m.map); srgb(m.emissiveMap);
          lin(m.normalMap); lin(m.bumpMap); lin(m.roughnessMap); lin(m.metalnessMap);
          lin(m.aoMap); lin(m.alphaMap); lin(m.specularMap); lin(m.displacementMap);
          if (m.clearcoatNormalMap) lin(m.clearcoatNormalMap);
          m.needsUpdate = true;
        });
      });
    }

    new FBXLoader(manager).load(
      MODEL_URL,
      function (object) {
        applyMaterialColorSpaces(object);
        object.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(object);
        const center = box.getCenter(new THREE.Vector3());
        object.position.sub(center);
        object.updateMatrixWorld(true);

        const box2 = new THREE.Box3().setFromObject(object);
        const size = box2.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z, 1e-6);
        const normalizeScale = 220 / maxDim;
        modelBaseScale = normalizeScale;
        object.scale.setScalar(normalizeScale);
        scene.add(object);
        modelRoot = object;

        const finalBox = new THREE.Box3().setFromObject(object);
        const finalSize = finalBox.getSize(new THREE.Vector3());
        const radius = Math.max(finalSize.x, finalSize.y, finalSize.z, 1e-6) * 0.5;
        const dist = radius * 3.0;
        camera.position.set(radius * 1.25, radius * 0.65, dist);
        controls.target.set(0, 0, 0);
        camera.near = 0.001;
        camera.far = Math.max(5000, dist * 40);
        camera.updateProjectionMatrix();
        controls.update();
      },
      undefined,
      function (err) {
        console.error(err);
        appendMessage('meta', '模型加载失败，请确认 模型/02-梵犀设计/02.FBX 与 texture 目录存在。');
      }
    );

    function onResize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();
    function tick() {
      requestAnimationFrame(tick);
      const dt = clock.getDelta();
      if (modelRoot && gestureActive) {
        modelRoot.scale.setScalar(modelBaseScale);
        gestureElapsed += dt;
        const t = Math.min(gestureElapsed / gestureDuration, 1);
        const envelope = Math.sin(Math.PI * t); // 平滑起停，最后回到0
        const wave = Math.sin(2 * Math.PI * gestureCycles * t);
        const angle = envelope * wave * gestureAmplitude;
        modelRoot.rotation.x = angle;
        modelRoot.rotation.y = 0;
        modelRoot.rotation.z = 0;
        if (t >= 1) {
          gestureActive = false;
          modelRoot.rotation.x = 0;
          modelRoot.rotation.y = 0;
          modelRoot.rotation.z = 0;
        }
      } else if (modelRoot) {
        idleTime += dt;
        const b = idleTime * (Math.PI * 2) * 0.22;
        const breath = Math.sin(b);
        const breathAsym = Math.sin(b * 2 + 0.45) * 0.32;
        const swayT = idleTime * 0.44;
        const sway =
          Math.sin(swayT) * 0.58 + Math.sin(swayT * 1.63 + 0.9) * 0.42;
        modelRoot.rotation.x = breath * 0.022 + breathAsym * 0.007;
        modelRoot.rotation.y = sway * 0.015;
        modelRoot.rotation.z = Math.sin(idleTime * 0.28 + 0.3) * 0.005;
        const sc = 1 + breath * 0.0058 + breathAsym * 0.0022;
        modelRoot.scale.setScalar(modelBaseScale * sc);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
